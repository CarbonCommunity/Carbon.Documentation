name: Generator

on:
  workflow_dispatch:

jobs:
  run:
    name: Run Generator
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Environment Setup
        id: step1
        shell: bash
        run: |
          echo "version=$(curl -s -L 'https://api.carbonmod.gg/version?id=docs&token=${{secrets.VERSIONS_TOKEN}}')" >> $GITHUB_OUTPUT

      - name: Generate
        shell: bash
        run: |
          cd tools
          chmod +x Generate.sh
          ./Generate.sh

      - name: Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: CarbonDir
          path: |
            tools/Server/carbon

      - name: ⬆️ SFTP - Upload Metadata
        shell: bash
        env:
          SFTP_HOST: redist.carbonmod.gg
          SFTP_PORT: 22
          SFTP_USER: carbonmod
          # Remote folder served as https://api.carbonmod.gg, relative to the SSH user's login folder (or absolute)
          SFTP_ROOT: /home/carbonmod/public_html/api.carbonmod.gg
          # Private key of the SSH user (OpenSSH format, no passphrase)
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          # Optional 'ssh-keyscan' output for the host; when empty the host key is trusted on first use
          SFTP_KNOWN_HOSTS: ${{ vars.SFTP_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [ -z "$SFTP_KEY" ]; then
            echo '::error::The SFTP_KEY secret is not set.'
            exit 1
          fi

          key="$RUNNER_TEMP/sftp_key"
          known_hosts="$RUNNER_TEMP/sftp_known_hosts"
          batch="$RUNNER_TEMP/sftp_batch.txt"
          trap 'rm -f "$key" "$known_hosts" "$batch"' EXIT

          # OpenSSH refuses private keys other accounts can read
          umask 077

          # Pasted secrets often pick up CRLF endings, indentation, literal '\n' or get flattened
          # to one line, any of which makes OpenSSH fail with 'error in libcrypto'. Rebuild the
          # key as one header line, the base64 body and one footer line.
          key_text="${SFTP_KEY//\\n/$'\n'}"
          printf '%s\n' "$key_text" \
            | tr -d '\r' \
            | sed -E 's/(-----[A-Z0-9 ]+-----)/\n\1\n/g' \
            | awk '/^[ \t]*-----/ { sub(/^[ \t]+/, ""); sub(/[ \t]+$/, ""); print; next } { gsub(/[ \t]+/, "\n"); print }' \
            | grep -v '^$' > "$key" || true

          if ! check=$(ssh-keygen -y -P '' -f "$key" 2>&1 >/dev/null); then
            echo "::error::SFTP_KEY is not a usable private key: ${check:-unknown error}"
            echo "First line: $(head -n 1 "$key")"
            echo "Lines: $(wc -l < "$key"), footer present: $(grep -q '^-----END' "$key" && echo yes || echo no)"
            echo 'The key must be an unencrypted private key (OpenSSH or PEM), pasted whole including the BEGIN/END lines.'
            exit 1
          fi

          options=(-b "$batch" -i "$key" -P "$SFTP_PORT" -o IdentitiesOnly=yes)

          if [ -n "$SFTP_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SFTP_KNOWN_HOSTS" | tr -d '\r' > "$known_hosts"
            options+=(-o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts")
          else
            echo '::warning::SFTP_KNOWN_HOSTS is not set, the SFTP host key is not being verified.'
            options+=(-o StrictHostKeyChecking=accept-new)
          fi

          results=tools/Server/carbon/results

          # <generator output>:<remote path under SFTP_ROOT>
          files=(
            "blueprints.json:meta/rust/blueprints.json"
            "entities.json:meta/rust/entities.json"
            "items.json:meta/rust/items.json"
            "loot-tables.json:meta/rust/loot-tables.json"
            "prefabs.json:meta/rust/prefabs.json"
            "rust_convars.json:meta/rust/convars.json"
            "rust_commands.json:meta/rust/commands.json"
            "hooks.json:meta/carbon/hooks.json"
            "commands.json:meta/carbon/commands.json"
            "convars.json:meta/carbon/convars.json"
            "switches.json:meta/carbon/switches.json"
          )

          {
            # mkdir isn't recursive, the '-' prefix ignores folders that already exist
            for folder in meta meta/rust meta/carbon; do
              echo "-mkdir \"$SFTP_ROOT/$folder\""
            done

            for entry in "${files[@]}"; do
              src="$results/${entry%%:*}"
              if [ ! -f "$src" ]; then
                echo "::error::Missing generator output: $src" >&2
                exit 1
              fi
              echo "put \"$src\" \"$SFTP_ROOT/${entry#*:}\""
            done

            echo 'bye'
          } > "$batch"

          sftp "${options[@]}" "$SFTP_USER@$SFTP_HOST"
